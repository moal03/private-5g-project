# Prometheus configuration for Phase 9 — private 5G monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9095']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'open5gs-upf-central'
    static_configs:
      - targets: ['127.0.0.7:9090']
        labels:
          upf: 'central'
          dnn: 'internet'

  - job_name: 'open5gs-upf-edge'
    static_configs:
      - targets: ['127.0.0.8:9091']
        labels:
          upf: 'edge'
          dnn: 'factory'
