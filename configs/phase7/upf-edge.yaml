logger:
  file:
    path: /var/log/open5gs/upf-edge.log

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - address: 127.0.0.8
    client:
      smf:
        - address: 127.0.0.4
  gtpu:
    server:
      - address: 127.0.0.8
  session:
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dnn: factory
      dev: ogstun2
  metrics:
    server:
      - address: 127.0.0.8
        port: 9091
