                      type: integer
                      default: 0
                  additionalProperties: false
              additionalProperties: false
            am:
              description: AM parameters
              type: object
              properties:
                tx:
                  description: AM TX parameters
                  type: object
                  properties:
                    sn:
                      description: RLC AM TX SN size
                      type: integer
                      default: 0
                    t-poll-retransmit:
                      description: RLC AM TX t-PollRetransmit (ms)
                      type: integer
                      default: 0
