$schema: http://json-schema.org/draft-07/schema#
$id: https://ocudu.org/schemas/du.schema.json
title: OCUDU 5G Distributed Unit configuration
type: object
properties:
  log:
    description: Logging configuration
    type: object
    properties:
      filename:
        description: Log file output path
        type: string
        default: /tmp/du.log
      all_level:
        description: Default log level for PHY, MAC, RLC, PDCP, RRC, SDAP, NGAP and GTPU
        type: string
      lib_level:
        description: Generic log level
        type: string
      e2ap_level:
        description: E2AP log level
        type: string
      config_level:
        description: Config log level
        type: string
      hex_max_size:
        description: Maximum number of bytes to print in hex (zero for no hex dumps, -1 for unlimited bytes)
        type: integer
        minimum: -1
        maximum: 1024
        default: 0
      flush_app_banner:
        description: Flush the logger when writing the application start and stop banners (not applicable to du_low)
        type: boolean
        default: false
      mac_level:
        description: MAC log level
        type: string
      rlc_level:
        description: RLC log level
        type: string
      f1ap_level:
        description: F1AP log level
        type: string
      f1u_level:
        description: F1-U log level
        type: string
      gtpu_level:
        description: GTPU log level
        type: string
      ntn_level:
        description: NTN log level
        type: string
      du_level:
        description: Log level for the DU
        type: string
      broadcast_enabled:
        description: Enable logging in the physical and MAC layer of broadcast messages and all PRACH opportunities
        type: boolean
        default: false
      f1ap_json_enabled:
        description: Enable JSON logging of F1AP PDUs
        type: boolean
        default: false
      high_latency_diagnostics_enabled:
        description: Log performance diagnostics when high computational latencies are detected
        type: boolean
        default: false
      fapi_level:
        description: FAPI log level
        type: string
      phy_level:
        description: PHY log level
        type: string
      hal_level:
        description: HAL log level
        type: string
      ofh_level:
        description: Open Fronthaul log level
        type: string
      radio_level:
        description: Radio log level
        type: string
    additionalProperties: false
  trace:
    description: General tracer configuration
    type: object
    properties:
      filename:
        description: Set to a valid file path to enable tracing and write the trace to the file
        type: string
        default: ""
      max_tracing_events_per_file:
        description: Maximum number of events per file. Set to zero for no limit
        type: integer
        default: 1000000
      nof_tracing_events_before_severe:
        description: Number of events to write prior to a severe event. Set to zero for writing all events
        type: integer
        default: 0
      layers:
        description: Layer basis execution tracing configuration
        type: object
        properties:
          du_high_enable:
            description: Enable tracing for DU-high executors
            type: boolean
            default: false
          phy_enable:
            description: Enable tracing for physical layer executors
            type: boolean
            default: false
          ru_enable:
            description: Enable tracing for RU executors
            type: boolean
            default: false
        additionalProperties: false
      schedtrace:
        description: MAC scheduler event and decision tracing
        type: object
        properties:
          enabled:
            description: Enable schedtrace for tracing MAC scheduler events and decisions
            type: boolean
            default: false
          path:
            description: Directory where schedtrace files will be stored. One file is generated per cell.
            type: string
            default: /tmp
          flush_period_ms:
            description: Periodicity in milliseconds at which schedtrace file writing takes place
            type: integer
            default: 50
        additionalProperties: false
    additionalProperties: false
  buffer_pool:
    description: Buffer pool configuration
    type: object
    properties:
      nof_segments:
        description: Number of segments allocated by the buffer pool
        type: integer
        default: 1048576
      segment_size:
        description: Size of each buffer pool segment in bytes
        type: integer
        default: 2048
    additionalProperties: false
  metrics:
    description: Metrics configuration
    type: object
    properties:
      layers:
        description: Layer basis metrics configuration
        type: object
        properties:
          enable_app_usage:
            description: Enable application usage metrics
            type: boolean
            default: false
          enable_executor:
            description: Whether to log application executors metrics
            type: boolean
            default: false
          enable_sched:
            description: Enable DU scheduler metrics
            type: boolean
            default: true
          enable_sched_ue:
            description: Enable DU per-UE scheduler metrics
            type: boolean
            default: true
          enable_rlc:
            description: Enable RLC metrics
            type: boolean
            default: false
          enable_mac:
            description: Enable MAC metrics
            type: boolean
            default: false
          enable_du_proc:
            description: Enable DU management and control procedure metrics
            type: boolean
            default: false
          enable_du_low:
            description: Enable DU low metrics (upper physical layer)
            type: boolean
            default: false
          enable_ru:
            description: Enable Radio Unit metrics
            type: boolean
            default: false
        additionalProperties: false
      enable_json:
        description: Enable JSON metrics reporting
        type: boolean
        default: false
      enable_log:
        description: Enable log metrics reporting
        type: boolean
        default: false
      enable_verbose:
        description: Enable extended detail metrics reporting
        type: boolean
        default: false
      autostart_stdout_metrics:
        description: Autostart stdout metrics reporting
        type: boolean
        default: false
      periodicity:
        description: Metrics periodicity configuration
        type: object
        properties:
          app_usage_report_period:
            description: Application resource usage metrics report period (in milliseconds)
            type: integer
            default: 1000
          executors_report_period:
            description: Executors metrics report period in milliseconds
            type: integer
            minimum: 0
            maximum: 10485760
            default: 1000
          du_report_period:
            description: DU statistics report period in milliseconds
            type: integer
            minimum: 0
            maximum: 10485760
            default: 1000
        additionalProperties: false
    additionalProperties: false
  expert_execution:
    description: Expert execution configuration
    type: object
    properties:
      affinities:
        description: Application CPU affinities configuration
        type: object
        properties:
          main_pool_cpus:
            description: CPU cores assigned to main thread pool
            type: string
          main_pool_pinning:
            description: Policy used for assigning CPU cores to the main thread pool
            type: string
          ofh:
            description: Open Fronthaul CPU affinities configuration
            type: object
            properties:
              timing_cpu:
                description: CPU used for timing in the Radio Unit
                type: string
              txrx_cpus:
                description: Sets the CPU affinities configuration for RU cells tx-rx threads. Number of entries specified defines the number of tx-rx threads created. By default if no entries is specifies, the number of tx-rx threads equals the number of RU cells
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
            additionalProperties: false
        additionalProperties: false
      threads:
        description: Threads configuration
        type: object
        properties:
          main_pool:
            description: Main thread pool configuration
            type: object
            properties:
              nof_threads:
                description: Number of threads for processing upper PHY and upper layers.
                type: integer
              task_queue_size:
                description: Main thread pool task queue size.
                type: integer
                default: 2048
              backoff_period:
                description: Main thread pool back-off period, in microseconds.
                type: integer
                default: 50
            additionalProperties: false
          upper_phy:
            description: Upper PHY thread configuration
            type: object
            properties:
              pdsch_processor_type:
                description: "PDSCH processor type: auto, generic and flexible."
                type: string
                default: auto
              pdsch_cb_batch_length:
                description: PDSCH flexible processor codeblock-batch size. Set it to 'auto' to adapt the batch length to the number of threads dedicated to downlink processing, set it to 'synchronous' to disable batch-splitting and ensure that TB processing remains within the  calling thread without parallelization.
                type: integer
                default: 4
              max_pucch_concurrency:
                description: Maximum PUCCH processing concurrency for all cells. Limits the maximum number of threads that can concurrently process Physical Uplink Control Channel (PUCCH). Set it to 'unlimited' for no limit of threads.
                type: integer
                default: 0
              max_pusch_and_srs_concurrency:
                description: Maximum PUSCH and SRS processing concurrency for all cells. Limits the maximum number of threads that can concurrently process Physical Uplink Shared Channel  (PUSCH) and Sounding Reference Signals (SRS). Set it to 'unlimited' for no limitation, or 'auto' to automatically derive it from the cell bandwidth, number of cells and maximum number of layers. If hardware acceleration is enabled, this parameter is set to the number of the accelerator queues.
                type: integer
                default: 4294967295
              max_pdsch_concurrency:
                description: Maximum concurrency level for PDSCH processing for all cells. Limits the number of threads that can concurrently process Physical Downlink Shared Channel (PDSCH). Set to 'unlimited' for no limitation. If hardware acceleration is enabled, this parameter is set to the number of the accelerator queues.
                type: integer
                default: 0
            additionalProperties: false
          ofh:
            description: Open Fronthaul thread configuration
            type: object
            properties:
              enable_busy_waiting:
                description: Enable busy waiting of the RU timing worker
                type: boolean
                default: false
            additionalProperties: false
          lower_phy:
            description: Lower PHY thread configuration
            type: object
            properties:
              execution_profile:
                description: "Lower physical layer executor profile [single, dual, triple].  - single: one task worker for all the lower physical layer task executors.  - dual: two task workers - one for the downlink and one for the uplink.  - triple: dedicated task workers for each of the subtasks (demodulation, reception and transmission)."
                type: string
            additionalProperties: false
        additionalProperties: false
      queues:
        description: Task executor queue parameters
        type: object
        properties:
          du_ue_data_executor_queue_size:
            description: DU's UE executor task queue size for PDU processing
            type: integer
            default: 8192
        additionalProperties: false
      cell_affinities:
        description: Sets the cell CPU affinities configuration on a per cell basis
        type: array
        items:
          type: object
          properties:
            ru_cpus:
              description: Number of CPUs used for the Radio Unit tasks
              type: string
            ru_pinning:
              description: Policy used for assigning CPU cores to the Radio Unit tasks
              type: string
          additionalProperties: false
    additionalProperties: false
  f1ap:
    description: F1AP interface configuration
    type: object
    properties:
      addrs:
        description: CU-CP F1-C addresses to connect to. Multiple addresses can be specified for SCTP multi-homing. The '--cu_cp_addr' name is a deprecated alias and should not be used.
        oneOf:
          - type: string
          - type: array
            items:
              type: string
        default:
          - 127.0.10.1
      bind_addrs:
        description: DU F1-C bind addresses. Multiple addresses can be specified for SCTP multi-homing. If left empty, implicit bind is performed. The '--bind_addr' name is a deprecated alias and should not be used.
        oneOf:
          - type: string
          - type: array
            items:
              type: string
        default:
          - 127.0.10.2
      retry_connection:
        description: Keep retrying the F1-C connection setup instead of closing the application when it fails. Allows the DU to be started before the CU-CP is reachable.
        type: boolean
        default: false
      sctp_rto_initial:
        description: SCTP initial RTO value in milliseconds (-1 to use system default)
        type: integer
        default: 120
      sctp_rto_min:
        description: SCTP RTO min in milliseconds (-1 to use system default)
        type: integer
        default: 120
      sctp_rto_max:
        description: SCTP RTO max in milliseconds (-1 to use system default)
        type: integer
        default: 500
      sctp_init_max_attempts:
        description: SCTP init max attempts (-1 to use system default)
        type: integer
        default: 3
      sctp_max_init_timeo:
        description: SCTP max init timeout in milliseconds (-1 to use system default)
        type: integer
        default: 500
      sctp_hb_interval:
        description: SCTP heartbeat interval in milliseconds (-1 to use system default)
        type: integer
        default: 30000
      sctp_assoc_max_retx:
        description: SCTP association max retransmissions (-1 to use system default)
        type: integer
        default: 10
      sctp_nodelay:
        description: Send SCTP messages as soon as possible without any Nagle-like algorithm
        type: boolean
        default: false
      dtls:
        description: DTLS configuration
        type: object
        properties:
          cert_filename:
            description: DTLS certificate filename (PEM format)
            type: string
            default: ""
          key_filename:
            description: DTLS key filename (PEM format)
            type: string
            default: ""
          ca_cert_filename:
            description: DTLS CA certificate filename (PEM format)
            type: string
            default: ""
        additionalProperties: false
    additionalProperties: false
  f1u:
    description: F1-U interface configuration
    type: object
    properties:
      queue_size:
        description: F1-U PDU queue size
        type: integer
        default: 2048
      bind_port:
        description: F1-U bind port
        type: integer
        default: 2152
      peer_port:
        description: F1-U peer port
        type: integer
        default: 2152
      socket:
        description: Configures UDP/IP socket parameters of the F1-U interface
        type: array
        items:
          type: object
          properties:
            bind_addr:
              description: Default local IP address interfaces bind to, unless a specific bind address is specified
              type: string
              default: 127.0.10.1
            sst:
              description: Slice Service Type
              type: integer
              minimum: 0
              maximum: 255
            sd:
              description: Service Differentiator
              type: integer
              minimum: 0
              maximum: 16777214
            five_qi:
              description: Assign this socket to a specific 5QI
              type: integer
              minimum: 0
              maximum: 255
            ext_addr:
              description: External IP address that is advertised for receiving UDP packets.
              type: string
              default: auto
            udp:
              description: UDP parameters
              type: object
              properties:
                max_rx_msgs:
                  description: Maximum amount of messages RX in a single syscall
                  type: integer
                  default: 256
                tx_qsize:
                  description: Size of TX queue used for batching SDUs.
                  type: integer
                  default: 4096
                max_tx_msgs:
                  description: Maximum amount of messages TX in a single syscall
                  type: integer
                  default: 256
                max_tx_segments:
                  description: Maximum amount of segments TX in a single SDU
                  type: integer
                  default: 256
                pool_threshold:
                  description: Pool accupancy threshold after which packets are dropped
                  type: number
                  default: 0.8999999761581421
                reuse_addr:
                  description: Allow multiple sockets to bind to the same port.
                  type: boolean
                  default: false
                dscp:
                  description: Differentiated Services Code Point value.
                  type: integer
                  minimum: 0
                  maximum: 63
              additionalProperties: false
          additionalProperties: false
    additionalProperties: false
  remote_control:
    description: Remote control configuration
    type: object
    properties:
      enabled:
        description: Enables the Remote Control Server
        type: boolean
        default: false
      bind_addr:
        description: Remote Control Server bind address
        type: string
        default: 127.0.0.1
      port:
        description: Port where the remote control server listens for incoming connections
        type: integer
        minimum: 0
        maximum: 65535
        default: 8001
    additionalProperties: false
  gnb_id:
    description: gNodeB identifier
    type: integer
    default: 411
  gnb_id_bit_length:
    description: gNodeB identifier length in bits
    type: integer
    minimum: 22
    maximum: 32
    default: 22
  gnb_du_id:
    description: gNB-DU Id
    type: integer
    minimum: 0
    maximum: 68719476735
    default: 0
  pcap:
    description: PCAP configuration
    type: object
    properties:
      f1ap_filename:
        description: F1AP PCAP file output path
        type: string
        default: /tmp/du_f1ap.pcap
      f1ap_enable:
        description: Enable F1AP packet capture
        type: boolean
        default: false
      f1u_filename:
        description: F1-U PCAP file output path
        type: string
        default: /tmp/du_f1u.pcap
      f1u_enable:
        description: Enable F1-U packet capture
        type: boolean
        default: false
      rlc_filename:
        description: RLC PCAP file output path
        type: string
        default: /tmp/du_rlc.pcap
      rlc_rb_type:
        description: RLC PCAP RB type (all, srb, drb)
        type: string
        default: all
      rlc_enable:
        description: Enable RLC packet capture
        type: boolean
        default: false
      mac_filename:
        description: MAC PCAP file output path
        type: string
        default: /tmp/du_mac.pcap
      mac_type:
        description: MAC PCAP pcap type (dlt or udp)
        type: string
        default: udp
      mac_enable:
        description: Enable MAC packet capture
        type: boolean
        default: false
      e2ap_du_filename:
        description: E2AP PCAP file output path
        type: string
        default: /tmp/du_e2ap.pcap
      e2ap_enable:
        description: Enable E2AP packet capture
        type: boolean
        default: false
    additionalProperties: false
  cell_cfg:
    description: Default cell configuration
    type: object
    properties:
      pci:
        description: PCI
        type: integer
        minimum: 0
        maximum: 1007
        default: 1
      sector_id:
        description: Sector ID (4-14 bits). This value is concatenated with the gNB Id to form the NR Cell Identity (NCI). If not specified, a unique value for the DU is automatically derived
        type: integer
        minimum: 0
        maximum: 16383
      dl_arfcn:
        description: Downlink ARFCN
        type: integer
        default: 536020
      band:
        description: NR band
        type: integer
      common_scs:
        description: Cell common subcarrier spacing
        type: integer
        enum:
          - 15
          - 30
          - 60
          - 120
          - 240
      channel_bandwidth_MHz:
        description: Channel bandwidth in MHz
        type: integer
        enum:
          - 5
          - 10
          - 15
          - 20
          - 25
          - 30
          - 40
          - 50
          - 60
          - 70
          - 80
          - 90
          - 100
          - 200
          - 400
      nof_antennas_ul:
        description: Number of antennas in uplink
        type: integer
        default: 1
      nof_antennas_dl:
        description: Number of antennas in downlink
        type: integer
        default: 1
      tx_ant_topology:
        description: Topology of the downlink antennas. If not set, it is derived from the number of downlink antennas
        type: string
        enum:
          - one_port
          - two_ports
          - four_ports
          - eight_ports
          - single_panel_two_one
          - single_panel_two_two
          - single_panel_four_one
      plmn:
        description: PLMN
        type: string
        pattern: ^[0-9]{5,6}$
        minLength: 5
        maxLength: 6
        default: 00101
      additional_plmns:
        description: List of PLMNs
        oneOf:
          - type: string
            pattern: ^[0-9]{5,6}$
            minLength: 5
            maxLength: 6
          - type: array
            items:
              type: string
              pattern: ^[0-9]{5,6}$
              minLength: 5
              maxLength: 6
        default:
          []
      tac:
        description: TAC
        type: integer
        default: 7
      additional_tacs:
        description: Additional TACs broadcast by this cell in trackingAreaList. NTN cells only
        oneOf:
          - type: integer
          - type: array
            items:
              type: integer
        default:
          []
      enabled:
        description: Automatically activate the cell on startup
        type: boolean
        default: true
      cell_barred:
        description: "MIB cellBarred: if true, UEs cannot camp on this cell"
        type: boolean
        default: false
      eutra_coexistence:
        description: "EUTRA coexistence: set to true if cell is deployed in conjunction with EUTRA"
        type: boolean
        default: false
      intra_freq_reselection:
        description: "MIB intraFreqReselection: if true, intra-frequency cell reselection is allowed when cell is barred"
        type: boolean
        default: true
      q_rx_lev_min:
        description: q-RxLevMin, required minimum received RSRP level for cell selection/re-selection, in dBm
        type: integer
        minimum: -70
        maximum: -22
        default: -70
      q_qual_min:
        description: q-QualMin, required minimum received RSRQ level for cell selection/re-selection, in dB
        type: integer
        minimum: -43
        maximum: -12
        default: -20
      pcg_p_nr_fr1:
        description: p-nr-fr1, maximum total TX power to be used by the UE in this NR cell group across in FR1
        type: integer
        minimum: -30
        maximum: 23
      geo_coordinates:
        description: Geographical coordinates of the cell/TRP antenna, TS 38.473, Section 9.3.1.184
        type: object
        properties:
          normal:
            description: Normal-accuracy TRP position
            type: object
            properties:
              latitude:
                description: Latitude of the antenna position [degree]
                type: number
                minimum: -90
                maximum: 90
                default: 0
              longitude:
                description: Longitude of the antenna position [degree]
                type: number
                minimum: -180
                maximum: 180
                default: 0
              altitude:
                description: Altitude of the antenna position [m]
                type: number
                default: 0
              uncertainty_semi_major:
                description: Uncertainty semi-major axis, as an uncertainty code
                type: integer
                minimum: 0
                maximum: 127
                default: 127
              uncertainty_semi_minor:
                description: Uncertainty semi-minor axis, as an uncertainty code
                type: integer
                minimum: 0
                maximum: 127
                default: 127
              orientation_of_major_axis:
                description: Orientation of the major axis of the uncertainty ellipse [degree]
                type: integer
                minimum: 0
                maximum: 179
                default: 0
              uncertainty_altitude:
                description: Uncertainty altitude, as an uncertainty code
                type: integer
                minimum: 0
                maximum: 127
                default: 127
              confidence:
                description: Confidence [%]
                type: integer
                minimum: 0
                maximum: 100
                default: 0
            additionalProperties: false
          high_accuracy:
            description: High-accuracy TRP position, TS 38.473, Section 9.3.1.190
            type: object
            properties:
              latitude:
                description: Latitude of the antenna position [degree]
                type: number
                minimum: -90
                maximum: 90
                default: 0
              longitude:
                description: Longitude of the antenna position [degree]
                type: number
                minimum: -180
                maximum: 180
                default: 0
              altitude:
                description: Altitude of the antenna position [m]
                type: number
                minimum: -500
                maximum: 10000
                default: 0
              uncertainty_semi_major:
                description: Uncertainty semi-major axis, as an uncertainty code
                type: integer
                minimum: 0
                maximum: 255
                default: 255
              uncertainty_semi_minor:
                description: Uncertainty semi-minor axis, as an uncertainty code
                type: integer
                minimum: 0
                maximum: 255
                default: 255
              orientation_of_major_axis:
                description: Orientation of the major axis of the uncertainty ellipse [degree]
                type: integer
                minimum: 0
                maximum: 179
                default: 0
              horizontal_confidence:
                description: Horizontal confidence [%]
                type: integer
                minimum: 0
                maximum: 100
                default: 0
              uncertainty_altitude:
                description: Uncertainty altitude, as an uncertainty code
                type: integer
                minimum: 0
                maximum: 255
                default: 255
              vertical_confidence:
                description: Vertical confidence [%]
                type: integer
                minimum: 0
                maximum: 100
                default: 0
            additionalProperties: false
        additionalProperties: false
      antenna_orientation:
        description: Orientation of the cell/TRP antenna array, TS 38.901, Section 7.1.3
        type: object
        properties:
          bearing:
            description: Bearing of the array normal, counter-clockwise from geographic North [degree]. For example, an array that faces East has a bearing of 270
            type: number
            default: 0
          downtilt:
            description: Downtilt of the array normal [degree]. Values below 90 point the normal below the horizon. For example, an uptilt of 5 degrees is a downtilt of 355
            type: number
            default: 0
          slant:
            description: Slant of the array around the array normal [degree]. Change the slant by 180 degrees if the reported angles are mirrored
            type: number
            default: 0
          report_zenith_aoa:
            description: Report the TRP angle of arrival of a linear array as the angle to the array axis (Z-AoA). Only an LMF with Rel-17 support accepts it
            type: boolean
            default: false
        additionalProperties: false
      mac_cell_group:
        description: MAC Cell Group parameters
        type: object
        properties:
          bsr_cfg:
            description: Buffer status report configuration parameters
            type: object
            properties:
              periodic_bsr_timer:
                description: Periodic Buffer Status Report Timer value in nof. subframes. Value 0 equates to infinity
                type: integer
                enum:
                  - 1
                  - 5
                  - 10
                  - 16
                  - 20
                  - 32
                  - 40
                  - 64
                  - 80
                  - 128
                  - 160
                  - 320
                  - 640
                  - 1280
                  - 2560
                  - 0
                default: 10
              retx_bsr_timer:
                description: Retransmission Buffer Status Report Timer value in nof. subframes
                type: integer
                enum:
                  - 10
                  - 20
                  - 40
                  - 80
                  - 160
                  - 320
                  - 640
                  - 1280
                  - 2560
                  - 5120
                  - 10240
                default: 80
              lc_sr_delay_timer:
                description: Logical Channel SR delay timer in nof. subframes
                type: integer
                enum:
                  - 20
                  - 40
                  - 64
                  - 128
                  - 512
                  - 1024
                  - 2560
            additionalProperties: false
          phr_cfg:
            description: Power Headroom report configuration parameters
