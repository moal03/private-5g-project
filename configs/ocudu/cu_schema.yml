        type: string
        default: /tmp/cu_ngu.pcap
      n3_enable:
        description: Enable NG-U GTP-U packet capture
        type: boolean
        default: false
      f1u_filename:
        description: F1-U GTP-U PCAP file output path
        type: string
        default: /tmp/cu_f1u.pcap
      f1u_enable:
        description: F1-U GTP-U PCAP
        type: boolean
        default: false
      e2ap_cu_up_filename:
        description: E2AP PCAP file output path
        type: string
        default: /tmp/cu_up_e2ap.pcap
    additionalProperties: false
  qos:
    description: Configures RLC and PDCP radio bearers on a per 5QI basis.
    type: array
    items:
      type: object
      properties:
        five_qi:
          description: 5QI
          type: integer
          minimum: 0
          maximum: 255
          default: 9
        rlc:
          description: RLC parameters
          type: object
          properties:
            mode:
              description: RLC mode
              type: string
              enum:
                - tm
                - um-bidir
                - um-unidir-ul
                - um-unidir-dl
                - am
            um-bidir:
              description: UM parameters
              type: object
              properties:
                tx:
                  description: UM TX parameters
                  type: object
                  properties:
                    sn:
                      description: RLC UM TX SN
                      type: integer
                      default: 0
                    queue-size:
                      description: RLC UM TX SDU queue size
                      type: integer
                      default: 0
                  additionalProperties: false
                rx:
                  description: UM TX parameters
                  type: object
                  properties:
                    sn:
                      description: RLC UM RX SN
                      type: integer
                      default: 0
                    t-reassembly:
                      description: RLC UM t-Reassembly
                      type: integer
                      default: 0
                  additionalProperties: false
              additionalProperties: false
            am:
              description: AM parameters
              type: object
              properties:
                tx:
                  description: AM TX parameters
                  type: object
                  properties:
                    sn:
                      description: RLC AM TX SN size
                      type: integer
                      default: 0
                    t-poll-retransmit:
                      description: RLC AM TX t-PollRetransmit (ms)
                      type: integer
                      default: 0
                    max-retx-threshold:
                      description: RLC AM max retx threshold
                      type: integer
                      default: 0
                    poll-pdu:
                      description: RLC AM TX PollPdu
                      type: integer
                      default: 0
                    poll-byte:
                      description: RLC AM TX PollByte
                      type: integer
                      default: 0
                    max_window:
                      description: Non-standard parameter that limits the tx window size. Can be used for limiting memory usage with large windows. 0 means no limits other than the SN size (i.e. 2^[sn_size-1]).
                      type: integer
                      default: 0
                    queue-size:
                      description: RLC AM TX SDU queue size
                      type: integer
                      default: 4096
                  additionalProperties: false
                rx:
                  description: AM RX parameters
                  type: object
                  properties:
                    sn:
                      description: RLC AM RX SN
                      type: integer
                      default: 0
                    t-reassembly:
                      description: RLC AM RX t-Reassembly
                      type: integer
                      default: 0
                    t-status-prohibit:
                      description: RLC AM RX t-StatusProhibit
                      type: integer
                      default: 0
                    max_sn_per_status:
                      description: RLC AM RX status SN limit
                      type: integer
                      default: 0
                  additionalProperties: false
              additionalProperties: false
          additionalProperties: false
        pdcp:
          description: PDCP parameters
          type: object
          properties:
            rohc:
              description: Header compression parameters
              type: object
              properties:
                rohc_type:
                  description: "ROHC type (none/rohc/ul_only_rohc). Values: {none, rohc, ul_only_rohc}. Default: none"
                  type: string
                  enum:
                    - none
                    - rohc
                    - uplink_only_rohc
                max_cid:
                  description: Maximum CID
                  type: integer
                  default: 15
                profile0x0001:
                  description: Configure profile0x0001 (ROHCv1 RTP/UDP/IP)
                  type: boolean
                  default: false
                profile0x0002:
                  description: Configure profile0x0002 (ROHCv1 UDP/IP)
                  type: boolean
                  default: false
                profile0x0003:
                  description: Configure profile0x0003 (ROHCv1 ESP/IP)
                  type: boolean
                  default: false
                profile0x0004:
                  description: Configure profile0x0004 (ROHCv1 IP)
                  type: boolean
                  default: false
                profile0x0006:
                  description: Configure profile0x0006 (ROHCv1 TCP/IP)
                  type: boolean
                  default: false
                profile0x0101:
                  description: Configure profile0x0101 (ROHCv2 RTP/UDP/IP)
                  type: boolean
                  default: false
                profile0x0102:
                  description: Configure profile0x0102 (ROHCv2 UDP/IP)
                  type: boolean
                  default: false
                profile0x0103:
                  description: Configure profile0x0103 (ROHCv2 ESP/IP)
                  type: boolean
                  default: false
                profile0x0104:
                  description: Configure profile0x0104 (ROHCv2 IP)
                  type: boolean
                  default: false
              additionalProperties: false
            tx:
              description: PDCP TX parameters
              type: object
              properties:
                sn:
                  description: PDCP TX SN size
                  type: integer
                  enum:
                    - 12
                    - 18
                  default: 0
                discard_timer:
                  description: PDCP TX discard timer (ms)
                  type: integer
                  default: 0
                status_report_required:
                  description: PDCP TX status report required
                  type: boolean
                  default: false
              additionalProperties: false
            rx:
              description: PDCP RX parameters
              type: object
              properties:
                sn:
                  description: PDCP RX SN size
                  type: integer
                  enum:
                    - 12
                    - 18
                  default: 0
                t_reordering:
                  description: PDCP RX t-Reordering (ms)
                  type: integer
                  default: 0
                out_of_order_delivery:
                  description: PDCP RX enable out-of-order delivery
                  type: boolean
                  default: false
              additionalProperties: false
          additionalProperties: false
        f1u_cu_up:
          description: F1-U parameters at CU_UP side
          type: object
          properties:
            backoff_timer:
              description: F1-U backoff timer (ms)
              type: integer
              default: 5
            queue_size:
              description: F1-U backoff timer (ms)
              type: integer
              default: 8192
            batch_size:
              description: F1-U backoff timer (ms)
              type: integer
              default: 256
          additionalProperties: false
      additionalProperties: false
  ntn:
    description: Global NTN configuration
    type: object
    properties:
      satellites:
        description: Globally-defined NTN satellites referenced by satellite_idx in cell ntn configs
        type: array
        items:
          type: object
          properties:
            satellite_idx:
              description: Satellite index. Required when defining a satellite object; optional when referencing or inline-defining a satellite, in which case it is mutually exclusive with epoch_timestamp, ephemeris_info, gateway_location and ta_info.
              type: integer
            epoch_timestamp:
              description: "Epoch timestamp (Unix ms or ISO 8601: YYYY-MM-DDTHH:MM:SS[.mmm])"
              type: string
            propagator_type:
              description: "Orbit propagator: rk4 or keplerian"
              type: string
              enum:
                - rk4
                - keplerian
            ephemeris_info_ecef:
              description: ECEF ephemeris
              type: object
              properties:
                pos_x:
                  description: X Position of the satellite [m]
                  type: number
                  minimum: -43620761.6
                  maximum: 43620759.3
                pos_y:
                  description: Y Position of the satellite [m]
                  type: number
                  minimum: -43620761.6
                  maximum: 43620759.3
                pos_z:
                  description: Z Position of the satellite [m]
                  type: number
                  minimum: -43620761.6
                  maximum: 43620759.3
                vel_x:
                  description: X Velocity of the satellite [m/s]
                  type: number
                  minimum: -7864.32
                  maximum: 7864.26
                vel_y:
                  description: Y Velocity of the satellite [m/s]
                  type: number
                  minimum: -7864.32
                  maximum: 7864.26
                vel_z:
                  description: Z Velocity of the satellite [m/s]
                  type: number
                  minimum: -7864.32
                  maximum: 7864.26
              additionalProperties: false
              required:
                - pos_x
                - pos_y
                - pos_z
                - vel_x
                - vel_y
                - vel_z
            ephemeris_orbital:
              description: Orbital ephemeris
              type: object
              properties:
                semi_major_axis:
                  description: Semi-major axis of the satellite [m]
                  type: number
                  minimum: 6500000
                  maximum: 42998632.07
                eccentricity:
                  description: Eccentricity of the satellite [-]
                  type: number
                  minimum: 0
                  maximum: 0.01500510825
                periapsis:
                  description: Periapsis of the satellite [rad]
                  type: number
                  minimum: 0
                  maximum: 6.28407400155
                longitude:
                  description: Longitude of the satellites angle of ascending node [rad]
                  type: number
                  minimum: 0
                  maximum: 6.28407400155
                inclination:
                  description: Inclination of the satellite [rad]
                  type: number
                  minimum: -1.57101850624
                  maximum: 1.57101848283
                mean_anomaly:
                  description: Mean anomaly of the satellite [rad]
                  type: number
                  minimum: 0
                  maximum: 6.28407400155
              additionalProperties: false
              required:
                - semi_major_axis
                - eccentricity
                - periapsis
                - longitude
                - inclination
                - mean_anomaly
            gateway_location:
              description: NTN gateway geodetic coordinates
              type: object
              properties:
                latitude:
                  description: Latitude [degree]
                  type: number
                  minimum: -90
                  maximum: 90
                  default: 0
                longitude:
                  description: Longitude [degree]
                  type: number
                  minimum: -180
                  maximum: 180
                  default: 0
                altitude:
                  description: Altitude [m]
                  type: number
                  minimum: -1000
                  maximum: 20000
                  default: 0
              additionalProperties: false
            ta_info:
              description: TA info override (mutually exclusive with gateway_location)
              type: object
              properties:
                ta_common:
                  description: TA common
                  type: number
                  minimum: 0
                  maximum: 270730
                  default: 0
                ta_common_drift:
                  description: Drift rate of the common TA
                  type: number
                  minimum: -51.4606
                  maximum: 51.4606
                  default: 0
                ta_common_drift_variant:
                  description: Drift rate variation of the common TA
                  type: number
                  minimum: 0
                  maximum: 0.57898
                  default: 0
                ta_common_offset:
                  description: Constant offset added to TA common
                  type: number
                  minimum: 0
                  maximum: 10000
              additionalProperties: false
          additionalProperties: false
    additionalProperties: false
  e2:
    description: E2 parameters
    type: object
    properties:
      enable_cu_cp_e2:
        description: Enable CU E2 agent
        type: boolean
        default: false
      addrs:
        description: RIC addresses to be used for E2 interface. Multiple addresses can be specified for SCTP multi-homing. The '--addr' name is a deprecated alias and should not be used.
        oneOf:
          - type: string
          - type: array
            items:
              type: string
        default:
          - 127.0.0.1
      port:
        description: RIC port
        type: integer
        minimum: 20000
        maximum: 40000
        default: 36421
      bind_addrs:
        description: Local bind addresses to be used for E2 interface. Multiple addresses can be specified for SCTP multi-homing. If left empty, implicit bind is performed. The '--bind_addr' name is a deprecated alias and should not be used.
        oneOf:
          - type: string
          - type: array
            items:
              type: string
        default:
          - 127.0.0.1
      sctp_rto_initial:
        description: SCTP initial RTO value in milliseconds (-1 to use system default)
        type: integer
        default: 120
      sctp_rto_min:
        description: SCTP RTO min in milliseconds (-1 to use system default)
        type: integer
        default: 120
      sctp_rto_max:
        description: SCTP RTO max in milliseconds (-1 to use system default)
        type: integer
        default: 500
      sctp_init_max_attempts:
        description: SCTP init max attempts (-1 to use system default)
        type: integer
        default: 3
      sctp_max_init_timeo:
        description: SCTP max init timeout in milliseconds (-1 to use system default)
        type: integer
        default: 500
      sctp_hb_interval:
        description: SCTP heartbeat interval in milliseconds (-1 to use system default)
        type: integer
        default: 30000
      sctp_assoc_max_retx:
        description: SCTP association max retransmissions (-1 to use system default)
        type: integer
        default: 10
      sctp_nodelay:
        description: Send SCTP messages as soon as possible without any Nagle-like algorithm
        type: boolean
        default: false
      e2sm_kpm_enabled:
        description: Enable KPM service module
        type: boolean
        default: false
      e2sm_rc_enabled:
        description: Enable RC service module
        type: boolean
        default: false
      e2sm_ccc_enabled:
        description: Enable CCC service module
        type: boolean
        default: false
      enable_cu_up_e2:
        description: Enable CU-UP E2 agent
        type: boolean
        default: false
    additionalProperties: false
  gnb_cu_up_id:
    description: gNB-CU-UP Id
    type: integer
    minimum: 0
    maximum: 68719476735
    default: 0
additionalProperties: false
