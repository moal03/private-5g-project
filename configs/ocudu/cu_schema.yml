$schema: http://json-schema.org/draft-07/schema#
$id: https://ocudu.org/schemas/cu.schema.json
title: OCUDU 5G CU configuration
type: object
properties:
  log:
    description: Logging configuration
    type: object
    properties:
      filename:
        description: Log file output path
        type: string
        default: /tmp/cu.log
      all_level:
        description: Default log level for PHY, MAC, RLC, PDCP, RRC, SDAP, NGAP and GTPU
        type: string
      lib_level:
        description: Generic log level
        type: string
      e2ap_level:
        description: E2AP log level
        type: string
      config_level:
        description: Config log level
        type: string
      hex_max_size:
        description: Maximum number of bytes to print in hex (zero for no hex dumps, -1 for unlimited bytes)
        type: integer
        minimum: -1
        maximum: 1024
        default: 0
      flush_app_banner:
        description: Flush the logger when writing the application start and stop banners (not applicable to du_low)
        type: boolean
        default: false
      pdcp_level:
        description: PDCP log level
        type: string
      rrc_level:
        description: RRC log level
        type: string
      ngap_level:
        description: NGAP log level
        type: string
      xnap_level:
        description: XNAP log level
        type: string
      nrppa_level:
        description: NRPPA log level
        type: string
      e1ap_level:
        description: E1AP log level
        type: string
      f1ap_level:
        description: F1AP log level
        type: string
      cu_level:
        description: Log level for the CU
        type: string
      sec_level:
        description: Security functions log level
        type: string
      e1ap_json_enabled:
        description: Enable JSON logging of E1AP PDUs
        type: boolean
        default: false
      f1ap_json_enabled:
        description: Enable JSON logging of F1AP PDUs
        type: boolean
        default: false
      sdap_level:
        description: SDAP log level
        type: string
      gtpu_level:
        description: GTPU log level
        type: string
      f1u_level:
        description: F1-U log level
        type: string
      rohc_level:
        description: ROHC log level
        type: string
    additionalProperties: false
  trace:
    description: General tracer configuration
    type: object
    properties:
      filename:
        description: Set to a valid file path to enable tracing and write the trace to the file
        type: string
        default: ""
      max_tracing_events_per_file:
        description: Maximum number of events per file. Set to zero for no limit
        type: integer
        default: 1000000
      nof_tracing_events_before_severe:
        description: Number of events to write prior to a severe event. Set to zero for writing all events
        type: integer
        default: 0
      layers:
        description: Metrics configuration
        type: object
        properties:
          cu_up_enable:
            description: Enable tracing for CU-UP executors
            type: boolean
            default: false
        additionalProperties: false
    additionalProperties: false
  buffer_pool:
    description: Buffer pool configuration
    type: object
    properties:
      nof_segments:
        description: Number of segments allocated by the buffer pool
        type: integer
        default: 1048576
      segment_size:
        description: Size of each buffer pool segment in bytes
        type: integer
        default: 2048
    additionalProperties: false
  metrics:
    description: Metrics configuration
    type: object
    properties:
      layers:
        description: Layer basis metrics configuration
        type: object
        properties:
          enable_app_usage:
            description: Enable application usage metrics
            type: boolean
            default: false
          enable_executor:
            description: Whether to log application executors metrics
            type: boolean
            default: false
          enable_ngap:
            description: Enable NGAP metrics
            type: boolean
            default: false
          enable_pdcp:
            description: Enable PDCP metrics
            type: boolean
            default: false
          enable_rrc:
            description: Enable CU-CP RRC metrics
            type: boolean
            default: false
          enable_e1ap:
            description: Enable E1AP metrics
            type: boolean
            default: false
          enable_nrup_cu:
            description: Enable NRUP metrics (CU side)
            type: boolean
            default: false
          skip_cu_up_executor:
            description: Whether to skip logging CU-UP executor metrics when executor logging is enabled application wide
            type: boolean
            default: true
        additionalProperties: false
      enable_json:
        description: Enable JSON metrics reporting
        type: boolean
        default: false
      enable_log:
        description: Enable log metrics reporting
        type: boolean
        default: false
      enable_verbose:
        description: Enable extended detail metrics reporting
        type: boolean
        default: false
      periodicity:
        description: Metrics periodicity configuration
        type: object
        properties:
          app_usage_report_period:
            description: Application resource usage metrics report period (in milliseconds)
            type: integer
            default: 1000
          executors_report_period:
            description: Executors metrics report period in milliseconds
            type: integer
            minimum: 0
            maximum: 10485760
            default: 1000
          cu_cp_report_period:
            description: CU-CP metrics report period in milliseconds
            type: integer
            default: 1000
          cu_up_report_period:
            description: CU-UP metrics report period in milliseconds
            type: integer
            default: 1000
        additionalProperties: false
    additionalProperties: false
  expert_execution:
    description: Expert execution configuration
    type: object
    properties:
      affinities:
        description: Application CPU affinities configuration
        type: object
        properties:
          main_pool_cpus:
            description: CPU cores assigned to main thread pool
            type: string
          main_pool_pinning:
            description: Policy used for assigning CPU cores to the main thread pool
            type: string
        additionalProperties: false
      threads:
        description: Threads configuration
        type: object
        properties:
          main_pool:
            description: Main thread pool configuration
            type: object
            properties:
              nof_threads:
                description: Number of threads for processing upper PHY and upper layers.
                type: integer
              task_queue_size:
                description: Main thread pool task queue size.
                type: integer
                default: 2048
              backoff_period:
                description: Main thread pool back-off period, in microseconds.
                type: integer
                default: 50
            additionalProperties: false
        additionalProperties: false
      queues:
        description: Task executor queue parameters
        type: object
        properties:
          cu_up_dl_ue_executor_queue_size:
            description: CU-UP's DL UE executor queue size
            type: integer
            default: 8192
          cu_up_ul_ue_executor_queue_size:
            description: CU-UP's UL UE executor queue size
            type: integer
            default: 8192
          cu_up_ctrl_ue_executor_queue_size:
            description: CU-UP's CTRL UE executor queue size
            type: integer
            default: 8192
          cu_up_strand_batch_size:
            description: CU-UP's strands batch size
            type: integer
            default: 256
        additionalProperties: false
    additionalProperties: false
  remote_control:
    description: Remote control configuration
    type: object
    properties:
      enabled:
        description: Enables the Remote Control Server
        type: boolean
        default: false
      bind_addr:
        description: Remote Control Server bind address
        type: string
        default: 127.0.0.1
      port:
        description: Port where the remote control server listens for incoming connections
        type: integer
        minimum: 0
        maximum: 65535
        default: 8001
    additionalProperties: false
  cu_cp:
    description: CU-CP parameters
    type: object
    properties:
      f1ap:
        description: F1AP parameters
        type: object
        properties:
          bind_addrs:
            description: CU F1-C bind addresses. Multiple addresses can be specified for SCTP multi-homing. The '--bind_addr' name is a deprecated alias and should not be used.
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
            default:
              - 127.0.10.1
          sctp_rto_initial:
            description: SCTP initial RTO value in milliseconds (-1 to use system default)
            type: integer
            default: 120
          sctp_rto_min:
            description: SCTP RTO min in milliseconds (-1 to use system default)
            type: integer
            default: 120
          sctp_rto_max:
            description: SCTP RTO max in milliseconds (-1 to use system default)
            type: integer
            default: 500
          sctp_init_max_attempts:
            description: SCTP init max attempts (-1 to use system default)
            type: integer
            default: 3
          sctp_max_init_timeo:
            description: SCTP max init timeout in milliseconds (-1 to use system default)
            type: integer
            default: 500
          sctp_hb_interval:
            description: SCTP heartbeat interval in milliseconds (-1 to use system default)
            type: integer
            default: 30000
          sctp_assoc_max_retx:
            description: SCTP association max retransmissions (-1 to use system default)
            type: integer
            default: 10
          sctp_nodelay:
            description: Send SCTP messages as soon as possible without any Nagle-like algorithm
            type: boolean
            default: false
          dtls:
            description: DTLS configuration
            type: object
            properties:
              cert_filename:
                description: DTLS certificate filename (PEM format)
                type: string
                default: ""
              key_filename:
                description: DTLS key filename (PEM format)
                type: string
                default: ""
              ca_cert_filename:
                description: DTLS CA certificate filename (PEM format)
                type: string
                default: ""
            additionalProperties: false
          procedure_timeout:
            description: Time that the F1AP waits for a DU response in milliseconds
            type: integer
            default: 1000
          ref_time_reporting:
            description: Reference Time Information Reporting Control (TS 38.473 section 8.12)
            type: object
            properties:
              enabled:
                description: Send Reference Time Information Reporting Control to each DU on connection
                type: boolean
                default: false
              event_type:
                description: "Reporting mode: \"on_demand\" (single report) or \"periodic\" (recurring reports)"
                type: string
                enum:
                  - on_demand
                  - periodic
                default: periodic
              periodicity_rf:
                description: Reporting period in radio frames (1 RF = 10 ms). Used only when event_type is "periodic"
                type: integer
                minimum: 1
                maximum: 512
                default: 100
            additionalProperties: false
        additionalProperties: false
      max_nof_dus:
        description: Maximum number of DU connections that the CU-CP may accept
        type: integer
        default: 6
      max_nof_cu_ups:
        description: Maximum number of CU-UP connections that the CU-CP may accept
        type: integer
        default: 6
      max_nof_ues:
        description: Maximum number of UEs that the CU-CP may accept
        type: integer
        default: 8192
      max_nof_drbs_per_ue:
        description: Maximum number of DRBs per UE
        type: integer
        minimum: 1
        maximum: 29
        default: 8
      inactivity_timer:
        description: UE/PDU Session/DRB inactivity timer in seconds
        type: integer
        minimum: 1
        maximum: 7200
        default: 120
      enable_rrc_inactive:
        description: Enable RRC inactive state for UEs based on inactivity timer. When disabled, UEs will be released on inactivity
        type: boolean
        default: false
      ran_paging_cycle:
        description: RAN Paging cycle for RRC inactive UEs in nof. Radio Frames
        type: integer
        enum:
          - 32
          - 64
          - 128
          - 256
        default: 32
      t380:
        description: RRC inactivity timer T380 in minutes. The timer is started when the UE receives a RRC Release message including a suspend config and is stopped on the reception of RRCResume.
        type: integer
        enum:
          - 5
          - 10
          - 20
          - 30
          - 60
          - 120
          - 360
          - 720
        default: 10
      full_i_rnti_profile:
        description: I-RNTI profile of the Full-I-RNTI, which sets the width of the Local NG-RAN Node Identifier it carries
        type: string
        enum:
          - profile0
          - profile1
          - profile2
          - profile3
        default: profile0
      short_i_rnti_profile:
        description: I-RNTI profile of the Short-I-RNTI, which sets the width of the Local NG-RAN Node Identifier it carries
        type: string
        enum:
          - profile0
          - profile1
        default: profile0
      request_pdu_session_timeout:
        description: Timeout for requesting a PDU session after the InitialUeMessage was sent to the core, in seconds. The timeout must be larger than T310. If the value is reached, the UE will be released.
        type: integer
        default: 3
      logical_cells:
        description: Sets the list of logical cells declared to the CU-CP (sector_id, admin_state, cell_barred)
        type: array
        items:
          type: object
          properties:
            sector_id:
              description: Sector ID (4-14 bits). This value is concatenated with the gNB Id to form the NR Cell Identity (NCI) of the logical cell, and must match the sector ID of the corresponding DU cell
              type: integer
              minimum: 0
              maximum: 16383
            admin_state:
              description: "Administrative state of the cell: locked cells are not activated by the CU-CP until unlocked by command"
              type: integer
              default: 0
            cell_barred:
              description: Intended MIB cellBarred state of the cell
              type: boolean
              default: false
          additionalProperties: false
          required:
            - sector_id
      amf:
        description: AMF configuration
        type: object
        properties:
          no_core:
            description: Allow CU-CP to run without a core
            type: boolean
            default: false
          amf_reconnection_retry_time:
            description: Time to wait after a failed AMF reconnection attempt in ms
            type: integer
            default: 1000
          procedure_timeout:
            description: Time that the NGAP waits for a response from the AMF in milliseconds
            type: integer
            default: 5000
          addrs:
            description: AMF addresses to be used for N2 interface. Multiple addresses can be specified for SCTP multi-homing. The '--addr' name is a deprecated alias and should not be used.
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
            default:
              - 127.0.1.100
          port:
            description: AMF port
            type: integer
            minimum: 20000
            maximum: 40000
            default: 38412
          bind_addrs:
            description: CU-CP bind addresses to be used for N2 interface. Multiple addresses can be specified for SCTP multi-homing. If left empty, implicit bind is performed. The '--bind_addr' name is a deprecated alias and should not be used.
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
            default:
              - 127.0.0.1
          bind_interface:
            description: Network device to bind for N2 interface
            type: string
            default: auto
          sctp_rto_initial:
            description: SCTP initial RTO value in milliseconds (-1 to use system default)
            type: integer
            default: 120
          sctp_rto_min:
            description: SCTP RTO min in milliseconds (-1 to use system default)
            type: integer
            default: 120
          sctp_rto_max:
            description: SCTP RTO max in milliseconds (-1 to use system default)
            type: integer
            default: 500
          sctp_init_max_attempts:
            description: SCTP init max attempts (-1 to use system default)
            type: integer
            default: 3
          sctp_max_init_timeo:
            description: SCTP max init timeout in milliseconds (-1 to use system default)
            type: integer
            default: 500
          sctp_hb_interval:
            description: SCTP heartbeat interval in milliseconds (-1 to use system default)
            type: integer
            default: 30000
          sctp_assoc_max_retx:
            description: SCTP association max retransmissions (-1 to use system default)
            type: integer
            default: 10
          sctp_nodelay:
            description: Send SCTP messages as soon as possible without any Nagle-like algorithm
            type: boolean
            default: false
          supported_tracking_areas:
            description: Sets the list of tracking areas supported by this AMF
            type: array
            items:
              type: object
              properties:
                tac:
                  description: TAC to be configured
                  type: integer
                  default: 0
                plmn_list:
                  description: Sets the list of PLMN items for this tracking area
                  type: array
                  items:
                    type: object
                    properties:
                      plmn:
                        description: PLMN to be configured
                        type: string
                        pattern: ^[0-9]{5,6}$
                        minLength: 5
                        maxLength: 6
                        default: ""
                      tai_slice_support_list:
                        description: Sets the list of TAI slices for this PLMN
                        type: array
                        items:
                          type: object
                          properties:
                            sst:
                              description: Slice Service Type
                              type: integer
                              minimum: 0
                              maximum: 255
                              default: 0
                            sd:
                              description: Service Differentiator
                              type: integer
                              minimum: 0
                              maximum: 16777215
                              default: 16777215
                          additionalProperties: false
                    additionalProperties: false
                satellite_rat:
                  description: Satellite RAT type signalled to the AMF for an NTN tracking area (TS 23.501, Section 5.4.10). Leave unset for a terrestrial tracking area
                  type: string
                  enum:
                    - nr_leo
                    - nr_meo
                    - nr_geo
                    - nr_othersat
              additionalProperties: false
        additionalProperties: false
      extra_amfs:
        description: Sets the list of extra AMFs for the CU-CP to connect to
        type: array
        items:
          type: object
          properties:
            addrs:
              description: AMF addresses to be used for N2 interface. Multiple addresses can be specified for SCTP multi-homing. The '--addr' name is a deprecated alias and should not be used.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              default:
                - 127.0.1.100
            port:
              description: AMF port
              type: integer
              minimum: 20000
              maximum: 40000
              default: 38412
            bind_addrs:
              description: CU-CP bind addresses to be used for N2 interface. Multiple addresses can be specified for SCTP multi-homing. If left empty, implicit bind is performed. The '--bind_addr' name is a deprecated alias and should not be used.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              default:
                - 127.0.0.1
            bind_interface:
              description: Network device to bind for N2 interface
              type: string
              default: auto
            sctp_rto_initial:
              description: SCTP initial RTO value in milliseconds (-1 to use system default)
              type: integer
              default: 120
            sctp_rto_min:
              description: SCTP RTO min in milliseconds (-1 to use system default)
              type: integer
              default: 120
            sctp_rto_max:
              description: SCTP RTO max in milliseconds (-1 to use system default)
              type: integer
              default: 500
            sctp_init_max_attempts:
              description: SCTP init max attempts (-1 to use system default)
              type: integer
              default: 3
            sctp_max_init_timeo:
              description: SCTP max init timeout in milliseconds (-1 to use system default)
              type: integer
              default: 500
            sctp_hb_interval:
              description: SCTP heartbeat interval in milliseconds (-1 to use system default)
              type: integer
              default: 30000
            sctp_assoc_max_retx:
              description: SCTP association max retransmissions (-1 to use system default)
              type: integer
              default: 10
            sctp_nodelay:
              description: Send SCTP messages as soon as possible without any Nagle-like algorithm
              type: boolean
              default: false
            supported_tracking_areas:
              description: Sets the list of tracking areas supported by this AMF
              type: array
              items:
                type: object
                properties:
                  tac:
                    description: TAC to be configured
                    type: integer
                    default: 0
                  plmn_list:
                    description: Sets the list of PLMN items for this tracking area
                    type: array
                    items:
                      type: object
                      properties:
                        plmn:
                          description: PLMN to be configured
                          type: string
                          pattern: ^[0-9]{5,6}$
                          minLength: 5
                          maxLength: 6
                          default: ""
                        tai_slice_support_list:
                          description: Sets the list of TAI slices for this PLMN
                          type: array
                          items:
                            type: object
                            properties:
                              sst:
                                description: Slice Service Type
                                type: integer
                                minimum: 0
                                maximum: 255
                                default: 0
                              sd:
                                description: Service Differentiator
                                type: integer
                                minimum: 0
                                maximum: 16777215
                                default: 16777215
                            additionalProperties: false
                      additionalProperties: false
                  satellite_rat:
                    description: Satellite RAT type signalled to the AMF for an NTN tracking area (TS 23.501, Section 5.4.10). Leave unset for a terrestrial tracking area
                    type: string
                    enum:
                      - nr_leo
                      - nr_meo
                      - nr_geo
                      - nr_othersat
                additionalProperties: false
          additionalProperties: false
      xnap:
        description: XNAP configuration
        type: object
        properties:
          procedure_timeout:
            description: Time that the XNAP waits for a response in milliseconds
            type: integer
            default: 5000
          reconnect_timer:
            description: Time that the XNAP waits before trying to reconnect in milliseconds
            type: integer
            default: 10000
          no_connection_init:
            description: When true, the CU-CP will not initiate XNAP connections, but will only accept inbound ones
            type: boolean
            default: false
          gateways:
            description: Sets the list of XnAP gateways, each with its own bind addresses, SCTP options, and Xn-C peer connections
            type: array
            items:
              type: object
              properties:
                bind_addrs:
                  description: Local IP addresses to bind for this XnAP gateway. Multiple addresses can be specified for SCTP multi-homing. If left empty, implicit bind is performed
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  default:
                    - 127.0.30.1
                sctp:
                  description: SCTP socket options
                  type: object
                  properties:
                    sctp_rto_initial:
                      description: SCTP initial RTO value in milliseconds (-1 to use system default)
                      type: integer
                      default: 120
                    sctp_rto_min:
                      description: SCTP RTO min in milliseconds (-1 to use system default)
                      type: integer
                      default: 120
                    sctp_rto_max:
                      description: SCTP RTO max in milliseconds (-1 to use system default)
                      type: integer
                      default: 500
                    sctp_init_max_attempts:
                      description: SCTP init max attempts (-1 to use system default)
                      type: integer
                      default: 3
                    sctp_max_init_timeo:
                      description: SCTP max init timeout in milliseconds (-1 to use system default)
                      type: integer
                      default: 500
                    sctp_hb_interval:
                      description: SCTP heartbeat interval in milliseconds (-1 to use system default)
                      type: integer
                      default: 30000
                    sctp_assoc_max_retx:
                      description: SCTP association max retransmissions (-1 to use system default)
                      type: integer
                      default: 10
                    sctp_nodelay:
                      description: Send SCTP messages as soon as possible without any Nagle-like algorithm
                      type: boolean
                      default: false
                  additionalProperties: false
                dtls:
                  description: DTLS options
                  type: object
                  properties:
                    mode:
                      description: DTLS mode
                      type: integer
                      default: 0
                    cert_filename:
                      description: DTLS certificate filename (PEM format)
                      type: string
                      default: ""
                    key_filename:
                      description: DTLS key filename (PEM format)
                      type: string
                      default: ""
                    ca_cert_filename:
                      description: DTLS CA certificate filename (PEM format)
                      type: string
                      default: ""
                  additionalProperties: false
                connections:
                  description: Sets the list of Xn-C peer connections reachable via this gateway
                  type: array
                  items:
                    type: object
                    properties:
                      peer_addrs:
                        description: Peer gNB IP addresses to connect for XnAP interface. Multiple addresses can be specified for SCTP multi-homing
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                        default:
                          []
                    additionalProperties: false
              additionalProperties: false
        additionalProperties: false
      mobility:
        description: Mobility configuration
        type: object
        properties:
          trigger_handover_from_measurements:
            description: Whether to start HO if neighbor cells become stronger
            type: boolean
            default: false
          trigger_cho_on_ue_setup:
            description: Whether to auto-trigger CHO after UE setup when readiness checks pass
            type: boolean
            default: false
          cho_timeout_ms:
            description: Timeout in milliseconds used for auto-triggered CHO and as default timeout for manual CHO command
            type: integer
            minimum: 1
            maximum: 600000
            default: 10000
          ntn_update_period_ms:
            description: Period in milliseconds of the NTN neighbour cell info updates in the measurement configuration
            type: integer
            minimum: 100
            maximum: 2000
            default: 1000
          cells:
            description: Sets the list of cells known to the CU-CP
            type: array
            items:
              type: object
              properties:
                nr_cell_id:
                  description: Cell id to be configured
                  type: integer
                  minimum: 0
                  maximum: 68719476735
                  default: 0
                periodic_report_cfg_id:
                  description: Periodical report configuration for the serving cell
                  type: integer
                  minimum: 1
                  maximum: 64
                band:
                  description: NR frequency band
                  type: integer
                gnb_id_bit_length:
                  description: gNodeB identifier bit length. If not set, it will be automatically set to be equal to the gNodeB Id of the CU-CP
                  type: integer
                  minimum: 22
                  maximum: 32
                pci:
                  description: Physical Cell Id
                  type: integer
                  minimum: 0
                  maximum: 1007
                plmn:
                  description: PLMN of the cell
                  type: string
                  pattern: ^[0-9]{5,6}$
                  minLength: 5
                  maxLength: 6
                tac:
                  description: Tracking Area Code
                  type: integer
                  minimum: 0
                  maximum: 16777215
                ssb_arfcn:
                  description: SSB ARFCN
                  type: integer
                ssb_scs:
                  description: SSB subcarrier spacing
                  type: integer
                  enum:
                    - 15
                    - 30
                    - 60
                    - 120
                    - 240
                ssb_period:
                  description: SSB period in ms
                  type: integer
                  enum:
                    - 5
